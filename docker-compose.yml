services:
  api:
    build:
      context: .
      target: development
    ports:
      - "8020:8020"
    env_file:
      - .env
    environment:
      PORT: "8020"
      HOST: "0.0.0.0"
      NODE_ENV: development
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "http://localhost:8020/api/auth/google/callback"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USER_ID: "${TELEGRAM_ALLOWED_USER_ID:-}"
    volumes:
      - ./packages:/app/packages

  web:
    build:
      context: .
      target: web-dev
    ports:
      - "8021:8021"
    env_file:
      - .env
    environment:
      VITE_API_URL: "http://localhost:8020"
      VITE_SHOW_PASSWORD_LOGIN: "${VITE_SHOW_PASSWORD_LOGIN:-true}"
    volumes:
      - ./packages:/app/packages
    depends_on:
      - api
