name: Deploy

run-name: Deploy to ${{ github.ref_name == 'main' && 'Prod' || 'Dev' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod
      pulumi_refresh:
        description: Run pulumi refresh before up (syncs state from GCP)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  infra:
    name: Infra
    needs: test
    runs-on: ubuntu-latest
    environment: prod

    env:
      PULUMI_BACKEND_URL: gs://bedtime-pulumi-state

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/28324530789/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-ci@bedtime-prod.iam.gserviceaccount.com

      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: infra
          refresh: ${{ github.event_name != 'workflow_dispatch' || inputs.pulumi_refresh }}
          config-map: |
            catalogSyncSecret:
              value: ${{ secrets.PROD_CATALOG_SYNC_SECRET }}
              secret: true
            universeMemorySyncSecret:
              value: ${{ secrets.PROD_UNIVERSE_MEMORY_SYNC_SECRET }}
              secret: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PROD_PULUMI_CONFIG_PASSPHRASE }}


  deploy:
    name: Deploy
    needs: [test, infra]
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/28324530789/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-ci@bedtime-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.PROD_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ vars.PROD_REGISTRY }}/api:${{ github.sha }}
          docker build \
            --target production \
            --build-arg VITE_SENTRY_DSN=${{ secrets.PROD_VITE_SENTRY_DSN }} \
            --build-arg SENTRY_ORG=${{ vars.PROD_SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ vars.PROD_SENTRY_PROJECT }} \
            --build-arg SENTRY_AUTH_TOKEN=${{ secrets.PROD_SENTRY_AUTH_TOKEN }} \
            --build-arg VITE_SHOW_PASSWORD_LOGIN="" \
            -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          IMAGE=${{ vars.PROD_REGISTRY }}/api:${{ github.sha }}
          gcloud run deploy bedtime-api \
            --image $IMAGE \
            --project ${{ vars.PROD_PROJECT_ID }} \
            --region ${{ vars.PROD_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --timeout=900 \
            --set-env-vars="NODE_ENV=production,HOST=0.0.0.0" \
            --set-env-vars="DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}" \
            --set-env-vars="OPENROUTER_API_KEY=${{ secrets.PROD_OPENROUTER_API_KEY }}" \
            --set-env-vars="SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}" \
            --set-env-vars="LANGFUSE_SECRET_KEY=${{ secrets.PROD_LANGFUSE_SECRET_KEY }}" \
            --set-env-vars="LANGFUSE_PUBLIC_KEY=${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}" \
            --set-env-vars="LANGFUSE_BASE_URL=${{ vars.PROD_LANGFUSE_BASE_URL }}" \
            --set-env-vars="GOOGLE_CLIENT_ID=${{ secrets.PROD_GOOGLE_CLIENT_ID }}" \
            --set-env-vars="GOOGLE_CLIENT_SECRET=${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}" \
            --set-env-vars="GOOGLE_REDIRECT_URI=https://bedtime-agent.ilya.online/api/auth/google/callback" \
            --set-env-vars="TELEGRAM_BOT_TOKEN=${{ secrets.PROD_TELEGRAM_BOT_TOKEN }}" \
            --set-env-vars="TELEGRAM_ALLOWED_USER_ID=${{ secrets.PROD_TELEGRAM_ALLOWED_USER_ID }}" \
            --set-env-vars="TELEGRAM_WEBHOOK_URL=https://bedtime-agent.ilya.online/api/telegram/webhook" \
            --set-env-vars="CATALOG_SYNC_SECRET=${{ secrets.PROD_CATALOG_SYNC_SECRET }}" \
            --set-env-vars="CATALOG_SYNC_MODE=gcp" \
            --set-env-vars="UNIVERSE_MEMORY_SYNC_SECRET=${{ secrets.PROD_UNIVERSE_MEMORY_SYNC_SECRET }}" \
            --set-env-vars="BACKFILL_SECRET=${{ secrets.PROD_BACKFILL_SECRET }}" \
            --set-env-vars="PIPELINE_QUEUE=projects/bedtime-prod/locations/us-central1/queues/bedtime-pipeline" \
            --set-env-vars="PIPELINE_WORKER_URL=https://bedtime-agent.ilya.online" \
            --set-env-vars="PIPELINE_WORKER_SECRET=${{ secrets.PROD_PIPELINE_WORKER_SECRET }}" \
            --quiet

      - name: Verify deployment health
        run: |
          URL="${{ vars.PROD_APP_URL }}"
          if [ -z "$URL" ]; then
            URL=$(gcloud run services describe bedtime-api \
              --project ${{ vars.PROD_PROJECT_ID }} \
              --region ${{ vars.PROD_REGION }} \
              --format="value(status.url)")
          fi
          echo "Health check: $URL/_healthz"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/_healthz")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s"
            sleep 5
          done
          echo "Health check failed after 60s"
          exit 1
