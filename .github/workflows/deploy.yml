name: Deploy

run-name: Deploy to ${{ github.ref_name == 'main' && 'Prod' || 'Dev' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options:
          - prod
      pulumi_refresh:
        description: Run pulumi refresh before up (syncs state from GCP)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  infra:
    name: Infra
    needs: test
    runs-on: ubuntu-latest
    environment: prod

    env:
      PULUMI_BACKEND_URL: gs://bedtime-pulumi-state

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/28324530789/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-ci@bedtime-prod.iam.gserviceaccount.com

      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: infra
          refresh: ${{ github.event_name != 'workflow_dispatch' || inputs.pulumi_refresh }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PROD_PULUMI_CONFIG_PASSPHRASE }}

  deploy:
    name: Deploy
    needs: [test, infra]
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/28324530789/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-ci@bedtime-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.PROD_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ vars.PROD_REGISTRY }}/api:${{ github.sha }}
          docker build \
            --target production \
            --build-arg VITE_SENTRY_DSN=${{ secrets.PROD_VITE_SENTRY_DSN }} \
            --build-arg SENTRY_ORG=${{ vars.PROD_SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ vars.PROD_SENTRY_PROJECT }} \
            --build-arg SENTRY_AUTH_TOKEN=${{ secrets.PROD_SENTRY_AUTH_TOKEN }} \
            -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          IMAGE=${{ vars.PROD_REGISTRY }}/api:${{ github.sha }}
          gcloud run deploy bedtime-api \
            --image $IMAGE \
            --project ${{ vars.PROD_PROJECT_ID }} \
            --region ${{ vars.PROD_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,HOST=0.0.0.0" \
            --set-env-vars="DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}" \
            --set-env-vars="OPENROUTER_API_KEY=${{ secrets.PROD_OPENROUTER_API_KEY }}" \
            --set-env-vars="SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}" \
            --set-env-vars="LANGFUSE_SECRET_KEY=${{ secrets.PROD_LANGFUSE_SECRET_KEY }}" \
            --set-env-vars="LANGFUSE_PUBLIC_KEY=${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}" \
            --set-env-vars="LANGFUSE_BASE_URL=${{ vars.PROD_LANGFUSE_BASE_URL }}" \
            --quiet
